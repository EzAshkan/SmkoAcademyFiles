server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Upload pieces are 4 MB; leave room.
    client_max_body_size 20m;

    # Behind Traefik (HTTPS ends there).
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Downloads stream through PHP: don't buffer, allow long transfers.
        fastcgi_buffering off;
        fastcgi_read_timeout 900;
        fastcgi_send_timeout 900;
    }

    # Real files get long caching; anything else (e.g. /livewire/livewire.js, generated by
    # the app) falls through to Laravel.
    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
